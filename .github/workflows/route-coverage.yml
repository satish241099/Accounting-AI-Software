name: Route Coverage Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  route-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI spec
        run: npm run openapi:validate
        env:
          REDOCLY_TOKEN: ${{ secrets.REDOCLY_TOKEN }}

      - name: Run route coverage guard
        run: npx vitest run tests/route-coverage.spec.ts
        env:
          CI: true