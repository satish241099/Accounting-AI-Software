[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myinvois-client"
version = "1.0.0"
description = "Production-grade Python client for LHDN MyInvois Intermediary API"
readme = "README.md"
authors = [
    {name = "Fullstack Forge", email = "engineering@fullstackforge.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.0",
    "httpx>=0.28.0",
    "boto3>=1.43.0",
    "python-dotenv>=1.2.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.17.0",
    "black>=26.10.0",
    "mypy>=2.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools]
packages = ["myinvois_client"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--strict-config", "--tb=short"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["myinvois_client"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]