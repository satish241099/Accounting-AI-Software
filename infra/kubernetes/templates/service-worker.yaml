apiVersion: v1
kind: Service
metadata:
  name: {{ include "accounting-saas.fullname" . }}-worker
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: filing-worker
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "accounting-saas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: filing-worker