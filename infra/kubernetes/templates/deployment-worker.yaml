apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accounting-saas.fullname" . }}-worker
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: filing-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "accounting-saas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: filing-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0  # Zero unavailable during rollout to prevent dropped filing jobs
  template:
    metadata:
      labels:
        {{- include "accounting-saas.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: filing-worker
      annotations:
        eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.annotations.eks.amazonaws.com/role-arn }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: filing-worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "{{ .Values.global.env }}"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "accounting-saas.fullname" . }}-db-config
                  key: database_url
            - name: PGSSLMODE
              value: "{{ .Values.tls.mode }}"
            - name: PGSSLROOTCERT
              value: "/etc/ssl/certs/rds-ca-bundle.pem"
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: rds-ca-bundle
              mountPath: /etc/ssl/certs/rds-ca-bundle.pem
              subPath: rds-ca-bundle.pem
              readOnly: true
      volumes:
        - name: rds-ca-bundle
          configMap:
            name: {{ .Values.rdsCa.name }}
            items:
              - key: rds-ca-bundle.pem
                path: rds-ca-bundle.pem