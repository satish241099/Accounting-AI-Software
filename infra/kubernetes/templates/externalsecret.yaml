apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "accounting-saas.fullname" . }}-db-postgres
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore.name }}
  target:
    name: {{ include "accounting-saas.fullname" . }}-db-config
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.postgres }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.postgres }}
        property: port
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.postgres }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.postgres }}
        property: password
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.postgres }}
        property: dbname

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "accounting-saas.fullname" . }}-db-admin
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore.name }}
  target:
    name: {{ include "accounting-saas.fullname" . }}-admin-config
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.admin }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.admin }}
        property: port
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.admin }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.admin }}
        property: password
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.externalSecret.secretNames.admin }}
        property: dbname