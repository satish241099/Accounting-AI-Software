apiVersion: v1
kind: Service
metadata:
  name: {{ include "accounting-saas.fullname" . }}-pgbouncer
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      protocol: TCP
      name: pgbouncer
  selector:
    {{- include "accounting-saas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer