apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "accounting-saas.fullname" . }}-api
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "accounting-saas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: accounting-saas
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
    - to: []  # Allow DNS
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []  # Allow external LHDN endpoints
      ports:
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "accounting-saas.fullname" . }}-worker
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: filing-worker
spec:
  podSelector:
    matchLabels:
      {{- include "accounting-saas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: filing-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []  # Allow external LHDN endpoints
      ports:
        - protocol: TCP
          port: 443