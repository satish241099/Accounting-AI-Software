apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "accounting-saas.fullname" . }}-api
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.pdb.api.minAvailable }}
  selector:
    matchLabels:
      {{- include "accounting-saas.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api

