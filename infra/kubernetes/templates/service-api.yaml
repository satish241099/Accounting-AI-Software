apiVersion: v1
kind: Service
metadata:
  name: {{ include "accounting-saas.fullname" . }}-api
  labels:
    {{- include "accounting-saas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    {{- include "accounting-saas.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api