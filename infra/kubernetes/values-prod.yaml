# Per-environment values for Malaysia Accounting SaaS Helm chart
# Overrides for production environment

# Global values
image:
  tag: "prod-latest"  # CI should pin to prod-specific digest

global:
  env: "prod"
  subnetIds: "PLACEHOLDER_SUBNET_IDS_PROD"
  securityGroupIds: "PLACEHOLDER_SG_IDS_PROD"
  eksEndpoint: "PLACEHOLDER_EKS_ENDPOINT_PROD"
  irsaRoleArn: "PLACEHOLDER_PROD_IRSA_ROLE_ARN"
  rdsCaBundle: "PLACEHOLDER_RDS_CA_BUNDLE_PROD"

# Replica counts for production (high availability)
replicaCount:
  web: 3
  api: 3
  worker: 3
  pgbouncer: 2

# Resource requests/limits for production (full)
resources:
  web:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  api:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  worker:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  pgbouncer:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# HPA configuration for production (wide range)
hpa:
  web:
    minReplicas: 3
    maxReplicas: 10
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  api:
    minReplicas: 3
    maxReplicas: 12
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  worker:
    minReplicas: 3
    maxReplicas: 10
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  pgbouncer:
    enabled: false

# KEDA configuration for production (production thresholds)
keda:
  api:
    triggers:
      - type: prometheus
        metadata:
          metricName: "http_requests_per_second"
          query: 'sum(rate(http_requests_total{service="api"}[1m])) by (pod)'
          threshold: "100"
  worker:
    triggers:
      - type: prometheus
        metadata:
          metricName: "filing_queue_depth"
          query: 'sum(filing_queue_pending_jobs) by (pod)'
          threshold: "10"

# PodDisruptionBudget for production (enabled)
pdb:
  web:
    enabled: true
    minAvailable: 2  # Production: at least 2 pods always available
  api:
    enabled: true
    minAvailable: 2
  worker:
    enabled: true
    minAvailable: 2
  pgbouncer:
    enabled: true
    minAvailable: 1

# NetworkPolicy for production (enforced)
networkPolicy:
  enabled: true

# Node selection for production
nodeSelector:
  node-type: "prod"

# Tolerations for production (dedicated node pools)
tolerations:
  - key: "node-type"
    operator: "Equal"
    value: "prod"
    effect: "NoSchedule"

# Topology spread constraints for production (multi-AZ)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: accounting-saas

# TLS for production (verify-full)
tls:
  mode: "verify-full"

# External Secret names for production
externalSecret:
  secretNames:
    postgres: "db/prod/postgres"
    admin: "db/prod/admin"

# Migration configuration for production
migration:
  image:
    tag: "prod-latest"